# 发布门禁阈值 —— 只覆盖，不缺省。
#
# 缺省值写在 src/evaluation/gate.py 的 DEFAULT_THRESHOLDS 里。这里放的是
# 「允许我按项目阶段调、但不想改代码」的那部分。改这里不影响任何代码路径。
#
# ⚠️ 加未知 key 会让门禁直接报错（不静默忽略）：写错一个词就等于那条阈值
#    没生效，而输出上完全看不出来 —— 这类静默失效正是门禁最该防的。

# ── 规则型：分子分母都来自库内报告（不调 LLM，可复算） ──
structure_complete: 1.0      # 结构完整率下限（竞品×维度逐格非空，[数据不足] 视为合格）
source_coverage: 0.90        # 出处覆盖率下限（留 10% 余量给"该维度确实无来源"）
conflicts_max: 0             # 数值冲突数上限（同竞品同字段同币种出现两个值，含表格）

# 任务级 Verified Success：三条规则全过才算「这单成了」。
# ⚠️ 分母是**窗口内全部任务**，不是「有报告的任务」—— 后者会把没写出报告的
#    那几条从分母里漏掉，越失败数字越好看。无从判（竞品/维度为空）也留在分母里：
#    证明不了合格就不算合格，但 detail 会同时打印可验证口径，避免读数误判。
verified_success_rate: 0.80

# ── 指标型：只读产物，不重跑 ──
intent_accuracy: 0.95        # 意图准确率下限（只认完整漏斗的那一轮）
holdout_accuracy: 0.90       # 验收集准确率下限（24 句新说法）
retrieval_faithfulness: 0.85 # 检索忠实度下限（RAGAS faithfulness，防编造）
memory_supersede_recall: 0.90    # 记忆取代召回下限（该顶掉的顶掉了吗）
memory_supersede_precision: 0.90 # 记忆取代精确下限（不该顶掉的顶掉了吗·误合并）
                                 # ⚠️ 只判召回时，误合并丢一条真信息也能满分
fetch_fail_rate_max: 0.60    # 抓取失败率上限（历史 60-73%，兜底后约 10%）

# ── 时效 ──
artifact_max_age_days: 30    # 评估产物超过此天数 → SKIP（缺证据 ≠ 合格）
report_window_days: 30       # 报告统计窗口（只看近 N 天，每任务取最新版本）
