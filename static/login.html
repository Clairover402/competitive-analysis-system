<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竞品分析系统 — 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background: #0f172a; color: #e2e8f0; display: flex;
            justify-content: center; align-items: center; min-height: 100vh;
        }
        .box {
            background: #1e293b; border-radius: 12px; padding: 40px;
            width: 380px; box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        h1 { font-size: 1.4rem; margin-bottom: 8px; text-align: center; color: #f1f5f9; }
        .sub { font-size: 0.85rem; text-align: center; color: #64748b; margin-bottom: 28px; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 4px; }
        input {
            width: 100%; padding: 10px 12px; margin-bottom: 16px; border: 1px solid #334155;
            border-radius: 6px; background: #0f172a; color: #e2e8f0; font-size: 0.95rem;
            outline: none; transition: border-color 0.2s;
        }
        input:focus { border-color: #3b82f6; }
        .btn-row { display: flex; gap: 10px; }
        button {
            flex: 1; padding: 10px 0; border: none; border-radius: 6px;
            font-size: 0.95rem; cursor: pointer; font-weight: 600; transition: opacity 0.2s;
        }
        button:hover { opacity: 0.85; }
        .btn-login { background: #3b82f6; color: #fff; }
        .btn-register { background: #334155; color: #e2e8f0; }
        .msg { margin-top: 14px; font-size: 0.82rem; text-align: center; min-height: 20px; }
        .msg-ok { color: #34d399; }
        .msg-err { color: #f87171; }
        hr { border: none; border-top: 1px solid #334155; margin: 20px 0; }
        .token-box { font-size: 0.72rem; color: #64748b; word-break: break-all; display: none; margin-top: 8px; }
    </style>
</head>
<body>
<div class="box">
    <h1>🔍 竞品分析系统</h1>
    <p class="sub">AI 驱动的多 Agent 协作分析平台</p>

    <label for="username">用户名</label>
    <input id="username" type="text" placeholder="输入用户名" autocomplete="username" maxlength="50">

    <label for="password">密码</label>
    <input id="password" type="password" placeholder="输入密码（≥6位）" autocomplete="current-password" maxlength="128">

    <div class="btn-row">
        <button class="btn-login" onclick="doLogin()">登 录</button>
        <button class="btn-register" onclick="doRegister()">注 册</button>
    </div>
    <div id="msg" class="msg"></div>
    <div id="tokenBox" class="token-box"></div>
</div>

<script>
    const API = '/api/auth';
    const msgEl = document.getElementById('msg');
    const tokenBox = document.getElementById('tokenBox');

    function show(s, cls) {
        msgEl.textContent = s;
        msgEl.className = 'msg ' + (cls || '');
    }

    async function doLogin() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        if (!u || !p) return show('请填写用户名和密码', 'msg-err');
        show('登录中...', '');
        try {
            const r = await fetch(API + '/login', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await r.json();
            if (!r.ok) throw new Error(data.detail || '登录失败');
            localStorage.setItem('token', data.token);
            localStorage.setItem('username', data.username);
            localStorage.setItem('user_id', data.user_id);
            show('✅ 登录成功！跳转中...', 'msg-ok');
            tokenBox.style.display = 'none';
            setTimeout(() => { window.location.href = '/'; }, 800);
        } catch (e) {
            show('❌ ' + e.message, 'msg-err');
        }
    }

    async function doRegister() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        if (!u || !p) return show('请填写用户名和密码', 'msg-err');
        if (p.length < 6) return show('密码至少 6 位', 'msg-err');
        if (!confirm('确认注册？注册即登录。')) return;
        show('注册中...', '');
        try {
            const r = await fetch(API + '/register', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await r.json();
            if (!r.ok) throw new Error(data.detail || '注册失败');
            localStorage.setItem('token', data.token);
            localStorage.setItem('username', data.username);
            localStorage.setItem('user_id', data.user_id);
            show('✅ 注册成功！', 'msg-ok');
            tokenBox.textContent = 'Token: ' + data.token;
            tokenBox.style.display = 'block';
        } catch (e) {
            show('❌ ' + e.message, 'msg-err');
        }
    }

    // Enter 键快捷登录
    document.getElementById('password').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doLogin();
    });
</script>
</body>
</html>
