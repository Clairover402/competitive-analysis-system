# ============================================================
# 竞品分析系统 — Grafana 监控面板 Docker Compose
# 说明：真实主库是手动容器 pg-chinese（localhost:5432），
#       本 compose 只负责 Grafana 监控面板，不再管理 postgres。
# 启动: docker compose -f docker/docker-compose.yml up -d grafana
# ============================================================
services:
  # ============================================================
  # Grafana 监控面板 — 直连 PostgreSQL（agent_logs 表）
  # 登录: admin / admin（首次登录会提示改密码，可跳过）
  # 访问: http://127.0.0.1:3000
  #
  # 注意：Grafana 连的是"手动容器 pg-chinese"（真实主库），
  # 通过 host.docker.internal 走宿主机 5432 映射到 pg-chinese。
  # ============================================================
  grafana:
    image: grafana/grafana:10.4.5
    container_name: competitive-analysis-grafana
    restart: unless-stopped
    ports:
      # 只绑本机回环地址——监控面板不暴露公网
      - "127.0.0.1:3000:3000"
    extra_hosts:
      # Docker Desktop 下把 host.docker.internal 解析到宿主机，
      # 让 Grafana 能访问映射在宿主机 5432 的 pg-chinese
      - "host.docker.internal:host-gateway"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      # 面板配置持久化
      - grafana-data:/var/lib/grafana
      # 数据源 + Dashboard 自动装载（provisioning）
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  grafana-data:
    name: competitive-analysis-grafana-data
